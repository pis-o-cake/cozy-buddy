[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# URL 은 migrations/env.py 가 Settings(COZY_DATABASE_URL)에서 채운다.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
