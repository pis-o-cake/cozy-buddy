[project]
name = "cozy-server"
version = "0.1.0"
description = "Cozy Buddy server: hub and mobile gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "loguru>=0.7",
    "protobuf==7.36.2",
    "uvicorn-worker (>=0.4)",
    "websockets (>=14)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
grpcio-tools = "1.85.1"
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
pytest-timeout = ">=2.3"
httpx = ">=0.27"
ruff = ">=0.8"
mypy = ">=1.13"
types-protobuf = ">=5.29"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["gen", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "gen"
explicit_package_bases = true
exclude = ["^gen/", "^migrations/", "^tests/"]

[[tool.mypy.overrides]]
# 생성 코드는 .pyi 의 타입만 쓰고 그 안의 오류는 보고하지 않는다.
module = ["cozy.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["gunicorn.*"]
ignore_missing_imports = true
