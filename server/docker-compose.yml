# HA 와 Matter 서버는 mDNS·Thread/Matter 탐색 때문에 Linux 홈 서버에서 host 네트워크가 필요하다.
# 기본 up 은 cozy-server·nginx 만 띄운다. HA·Matter 는 --profile home 으로 켠다.
# host 모드는 Docker Desktop(macOS/Windows)에서 동작하지 않으므로 그곳에서는 HA 설정을 따로 한다.
services:
  cozy-server:
    build:
      context: .
      additional_contexts:
        protocol: ../protocol/proto
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - cozy-server
    ports:
      - "${COZY_HTTP_PORT:-8120}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  homeassistant:
    profiles: ["home"]
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    privileged: true
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  matter-server:
    profiles: ["home"]
    image: ghcr.io/matter-js/matterjs-server:stable
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./data/matter:/data
    restart: unless-stopped
