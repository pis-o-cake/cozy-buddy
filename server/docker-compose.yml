# HA 와 Matter 서버는 mDNS·Thread/Matter 탐색 때문에 Linux 홈 서버에서 host 네트워크가 필요하다.
# 기본 up 은 cozy-server·nginx 만 띄운다. HA·Matter 는 --profile home 으로 켠다.
# host 모드는 Docker Desktop(macOS/Windows)에서 동작하지 않으므로 그곳에서는 HA 설정을 따로 한다.
name: cozy-buddy
services:
  cozy-server:
    build:
      context: .
      additional_contexts:
        protocol: ../protocol/proto
    # 규칙: 루트 ../.env 의 COZY_HA_URL 은 맥 로컬 실행용(LAN IP)이다.
    # Docker Desktop 에서는 컨테이너가 같은 호스트의 LAN IP 로 되돌아 나가지 못한다(hairpin 타임아웃).
    # 컨테이너 전용 값은 git 제외 파일 server/.env 에 COZY_HA_URL=http://host.docker.internal:8124 로 둔다.
    # env_file 은 뒤에 나열한 파일이 앞을 덮어쓰므로 .env 가 ../.env 를 이긴다.
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    # Linux 에서도 host.docker.internal 이 호스트 게이트웨이로 풀리도록 한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cozy-data:/app/data
    expose:
      - "8000"
    # 비root 로 도는 앱이라 권한 상승과 리눅스 capability 가 필요 없다.
    # TODO: read_only 루트 파일시스템. 컨테이너 안에서 쓰기 경로(홈의 gunicorn 소켓, /tmp)를 확인한 뒤 켠다.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - cozy-server
    ports:
      - "${COZY_HTTP_PORT:-8120}:80"
    # 규칙: 단일 파일 bind mount 는 mutagen 의 원자적 교체(새 inode)를 따라가지 못해 옛 설정이 남는다.
    # 디렉터리를 마운트하고 -c 로 직접 지정한다. 설정 변경은 dev-deploy.sh 의 nginx -s reload 로 반영된다.
    command: ["nginx", "-c", "/etc/cozy-nginx/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./deploy/nginx:/etc/cozy-nginx:ro
    restart: unless-stopped

  homeassistant:
    profiles: ["home"]
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    privileged: true
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  matter-server:
    profiles: ["home"]
    image: ghcr.io/matter-js/matterjs-server:stable
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./data/matter:/data
    restart: unless-stopped

volumes:
  cozy-data:
