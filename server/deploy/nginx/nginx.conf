events {}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream cozy_server {
        server cozy-server:8000;
    }

    # IP 별 요청 한도. 페어링 코드 추측(6자리)을 막으려고 /api/auth/pair 는 더 엄격하다.
    limit_req_zone $binary_remote_addr zone=cozy_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=cozy_pair:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=cozy_ws:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        # TODO: TLS 종단. 외부 접속은 Tailscale 경유라 인증서 방식은 배포 시 결정한다.

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location /ws {
            limit_conn cozy_ws 16;
            proxy_pass http://cozy_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 허브 연결은 장시간 유지된다. 유휴 연결이 끊기지 않게 한다.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /api/auth/pair {
            limit_req zone=cozy_pair burst=5 nodelay;
            client_max_body_size 64k;
            proxy_pass http://cozy_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=cozy_api burst=20 nodelay;
            client_max_body_size 64k;
            proxy_pass http://cozy_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://cozy_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
