system:
  profile: 'baseline'

project:
  name: 'cozy-buddy'
  source-of-truth:
    design: 'docs/'

commands:
  verify: 'sh scripts/verify.sh'

vcs:
  commit:
    subject-language: 'en'
    subject-ending: 'imperative'
    scopes:
      - 'adr'
      - 'architecture'
      - 'ci'
      - 'design'
      - 'engsys'
      - 'hub'
      - 'legacy'
      - 'mobile'
      - 'plan'
      - 'protocol'
      - 'repo'
      - 'review'
      - 'scope'
      - 'server'
      - 'spike'
      - 'ui'
  branch:
    model: 'single-main'
    roles:
      - role: 'production'
        branch: 'main'
    prefixes:
      feature: 'feat/'
      fix: 'fix/'
    naming:
      - 'feat/*'
      - 'fix/*'
      - 'docs/*'
      - 'spike/*'
      - 'chore/*'
    protected:
      - 'main'
  merge-request:
    target: 'main'
  tracker:
    provider: 'github'
    project: 'pis-o-cake/cozy-buddy'
    default-assignee: 'pis-o-cake'
    agent:
      search: 'allowed'
      create: 'allowed'
      comment: 'allowed'
      close: 'ask'
      accept-risk: 'ask'
      commit-deadline: 'ask'

documentation:
  generated: []
  architecture: 'docs/architecture/README.md'
  authoring:
    assign:
      - path: 'README.md'
        type: 'guide'
      - path: 'docs/review'
        type: 'review-report'
      - path: 'docs/scope'
        type: 'project-scope'
      - path: 'docs/adr'
        type: 'decision-record'
      - path: 'docs/design'
        type: 'design-proposal'
      - path: 'docs/architecture'
        type: 'architecture'
      - path: 'docs/spike'
        type: 'experiment-report'
      - path: 'docs/plan'
        type: 'work-plan'
      - path: 'docs/ui'
        type: 'ui-guideline'
    exempt:
      - '.claude'
      - 'docs/diagrams'
  review:
    scopes:
      - 'README.md'
      - 'docs/review'
      - 'docs/scope'
      - 'docs/adr'
      - 'docs/design'
      - 'docs/architecture'
      - 'docs/spike'
      - 'docs/plan'
      - 'docs/ui'
  lifecycle:
    design:
      path: 'docs/design'
      frozen-status: ['implemented']
    adr:
      path: 'docs/adr'
      frozen-status: ['accepted']
