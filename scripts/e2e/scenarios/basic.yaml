# 기본 시나리오. 같은 허브 연결에서 순서대로 실행한다.
# 방 이름 + "불" 은 결정론 매처 어휘라 기기 이름이 영어여도 동작한다.
# expect_area_light: "방이름=on|off" 는 그 방 조명 중 하나가 해당 상태로 바뀌어야 통과한다.
# 알람/타이머는 만든 직후 취소 발화로 지운다. 도구도 종료 시 남은 알람을 정리한다.
utterances:
  - text: "거실 불 꺼줘"
    expect_area_light: "거실=off"
  - text: "거실 불 켜줘"
    expect_area_light: "거실=on"
  - text: "5분 타이머 맞춰줘"
  - text: "5분 타이머 취소해줘"
  - text: "내일 아침 7시에 깨워줘"
  - text: "내일 아침 7시 알람 취소해줘"
  - text: "거실 불 켜져 있어?"
  - text: "오늘 기분 어때?"
